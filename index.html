<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Editor CASI CLINICI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.jsdelivr.net/npm/konva@9.3.0/konva.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: #f5f7fb;
      color: #1f2933;
    }

    .app {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 24px 32px;
    }

    .page-title {
      font-size: 24px;
      font-weight: 600;
      color: #16192c;
      margin-bottom: 16px;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      border: 1px solid #dde1ee;
      box-shadow: 0 4px 12px rgba(34, 54, 89, 0.06);
      padding: 20px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    select,
    input[type="color"],
    input[type="range"],
    button {
      font-family: inherit;
      font-size: 13px;
    }

    select {
      border-radius: 999px;
      border: 1px solid #c1c7d0;
      padding: 4px 10px;
      background: #ffffff;
      outline: none;
      color: #253858;
    }

    button {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #c1c7d0;
      background: #ffffff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    button.primary {
      background: #2684ff;
      color: white;
      border-color: #2684ff;
    }

    .canvas-shell {
      border-radius: 20px;
      background: #edeff5;
      padding: 12px;
      margin-top: 12px;
    }

    /* Finestra che deve combaciare con l'immagine */
    .canvas-viewport {
      border-radius: 16px;
      background: #f4f5fa;
      overflow: hidden;
      border: 1px solid #dde1ee;
      position: relative;
      margin: 0 auto;
      /* width/height verranno impostate in JS in base all'immagine */
    }

    #container {
      width: 100%;
      height: 100%;
    }

    .error-box {
      display: none;
      background: #ffeef0;
      border: 1px solid #f5c2c7;
      padding: 8px 12px;
      border-radius: 8px;
      color: #c53030;
      margin-bottom: 10px;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="app">
    <h2 class="page-title">Cartella clinica fisioterapica</h2>

    <div id="error-box" class="error-box"></div>

    <div class="card">
      <div class="toolbar">
        <select id="tool">
          <option value="pen">Penna</option>
          <option value="arrow">Freccia</option>
          <option value="text">Testo</option>
        </select>

        <input type="color" id="color" value="#ff0000" />
        <input type="range" id="size" min="1" max="20" value="4" />

        <button id="undo">↩️ Undo</button>
        <button id="reset">🧹 Reset</button>
        <button id="restore">🔄 Torna all'originale</button>
        <button id="save" class="primary">💾 Salva</button>
      </div>

      <div class="canvas-shell">
        <div class="canvas-viewport">
          <div id="container"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const errorBox = document.getElementById("error-box");

    function showError(msg) {
      errorBox.style.display = "block";
      errorBox.textContent = msg;
    }

    // ---- recordId dall'URL ----
    const params = new URLSearchParams(window.location.search);
    const recordId = params.get("recordId");

    if (!recordId) showError("recordId mancante");

    // ---- Carica il record (immagine corrente nel campo BODY) ----
    fetch("/api/record?recordId=" + recordId)
      .then(r => r.json())
      .then(data => {
        if (!data.imageUrl) throw new Error("Nessuna immagine trovata");
        runEditor(data.imageUrl, data.filename || "immagine.png");
      })
      .catch(err => showError(err.message));


    function runEditor(imageUrl, filename) {
      const viewport = document.querySelector(".canvas-viewport");

      const stage = new Konva.Stage({
        container: "container",
        width: 1000,
        height: 520,
      });

      const backgroundLayer = new Konva.Layer();
      const drawLayer = new Konva.Layer();
      stage.add(backgroundLayer);
      stage.add(drawLayer);

      // niente pan, niente zoom:
      stage.draggable(false);

      // carica immagine e adatta finestra alla stessa dimensione
      const img = new Image();
      img.crossOrigin = "Anonymous";
      img.onload = function () {
        // QUI: usiamo la dimensione reale dell'immagine (un po' più grande)
        const imgWidth = img.width;
        const imgHeight = img.height;

        stage.width(imgWidth);
        stage.height(imgHeight);

        // finestra esattamente uguale all'immagine
        viewport.style.width = imgWidth + "px";
        viewport.style.height = imgHeight + "px";

        const kImg = new Konva.Image({
          image: img,
          x: 0,
          y: 0,
          width: imgWidth,
          height: imgHeight,
        });

        backgroundLayer.add(kImg);
        backgroundLayer.draw();
      };

      // anti-cache
      img.src = imageUrl + (imageUrl.includes("?") ? "&" : "?") + "t=" + Date.now();

      let isDrawing = false;
      let currentShape = null;

      const toolSelect = document.getElementById("tool");
      const colorInput = document.getElementById("color");
      const sizeInput = document.getElementById("size");

      function getTool() {
        return toolSelect.value;
      }

      stage.on("mousedown", () => {
        const pos = stage.getPointerPosition();
        if (!pos) return;

        const tool = getTool();
        const color = colorInput.value;
        const size = Number(sizeInput.value);

        if (tool === "pen") {
          isDrawing = true;
          currentShape = new Konva.Line({
            stroke: color,
            strokeWidth: size,
            points: [pos.x, pos.y],
            lineCap: "round",
            lineJoin: "round",
          });
          drawLayer.add(currentShape);
        } else if (tool === "arrow") {
          isDrawing = true;
          currentShape = new Konva.Arrow({
            stroke: color,
            fill: color,
            strokeWidth: size,
            points: [pos.x, pos.y, pos.x, pos.y],
            pointerLength: 10 + size,
            pointerWidth: 10 + size,
          });
          drawLayer.add(currentShape);
        } else if (tool === "text") {
          const txt = prompt("Testo:");
          if (!txt) return;

          const t = new Konva.Text({
            x: pos.x,
            y: pos.y,
            text: txt,
            fill: color,
            fontSize: size * 4,
            draggable: true,
          });

          drawLayer.add(t);
        }
      });

      stage.on("mousemove", () => {
        if (!isDrawing || !currentShape) return;
        const pos = stage.getPointerPosition();
        if (!pos) return;

        const tool = getTool();
        if (tool === "pen") {
          currentShape.points(
            currentShape.points().concat([pos.x, pos.y])
          );
        } else if (tool === "arrow") {
          let pts = currentShape.points();
          pts[2] = pos.x;
          pts[3] = pos.y;
          currentShape.points(pts);
        }
        drawLayer.batchDraw();
      });

      stage.on("mouseup", () => {
        isDrawing = false;
        currentShape = null;
      });

      // ---- UNDO ----
      document.getElementById("undo").onclick = () => {
        const children = drawLayer.children();
        const last = children[children.length - 1];
        if (!last) return;
        last.destroy();
        drawLayer.draw();
      };

      // ---- RESET (cancella tutti i disegni) ----
      document.getElementById("reset").onclick = () => {
        drawLayer.destroyChildren();
        drawLayer.draw();
      };

      // ---- TORNA ALL'ORIGINALE ----
      document.getElementById("restore").onclick = () => {
        if (!confirm("Vuoi davvero tornare all'immagine originale? Tutti i disegni andranno persi.")) {
          return;
        }

        fetch("/api/reset-original", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ recordId }),
        })
          .then((r) => r.json())
          .then((data) => {
            if (!data.ok) throw new Error(data.error || "Errore nel ripristino");
            // ricarico la pagina per ricaricare anche l'immagine da BODY
            location.reload();
          })
          .catch((err) => showError(err.message));
      };

      // ---- SALVA ----
      document.getElementById("save").onclick = () => {
        const dataURL = stage.toDataURL({ pixelRatio: 2 });

        fetch("/api/record", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ recordId, dataURL, filename }),
        })
          .then((r) => r.json())
          .then(() => alert("Immagine salvata!"))
          .catch((err) => showError(err.message));
      };
    }
  </script>
</body>
</html>
